name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  code-quality:
    name: Code Quality & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code formatting (Prettier)
        run: pnpm run check

      - name: Verify route tree sync
        run: pnpm run check:routes

      - name: Verify Cloudflare Worker types sync
        run: pnpm run check:types

      - name: Run linter (ESLint)
        run: pnpm run lint

      - name: Run type checking (TypeScript)
        run: pnpm run typecheck

      - name: Run tests (Vitest)
        run: pnpm run test

      - name: Build application (Vite)
        run: pnpm run build

  security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Audit pnpm dependencies
        run: pnpm audit --audit-level=high

      - name: Review PR dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5.0.0
        continue-on-error: true

  secret-scan:
    name: Secret Leak Detection (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scanner
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql-analysis:
    name: CodeQL Security Analysis (SAST)
    if: github.event.repository.private == false || vars.ENABLE_CODEQL == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        id: codeql-init
        uses: github/codeql-action/init@v4
        continue-on-error: true
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL analysis
        if: steps.codeql-init.outcome == 'success'
        uses: github/codeql-action/analyze@v4
        continue-on-error: true

  preview:
    name: Deploy PR preview to Cloudflare Workers
    needs: [code-quality, security-audit, secret-scan]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: concept-staging-deploy
      cancel-in-progress: false
    environment:
      name: preview
      url: ${{ steps.preview.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build preview bundle
        run: pnpm run build

      - name: Apply preview database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc

      - name: Create or update PR preview
        id: preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/cloudflare-preview.jsonl
        run: |
          pnpm exec wrangler preview --name "pr-$PR_NUMBER"
          preview_url="$(jq -ser '[.[] | select(.type == "preview")] | last | .preview_urls[0]' "$WRANGLER_OUTPUT_FILE_PATH")"
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"
          printf '### PR preview\n\n[Open preview](%s)\n' "$preview_url" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Cloudflare Workers
    needs: [code-quality, security-audit, secret-scan]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        run: pnpm run build

      - name: Apply production database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply DB --remote

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy
